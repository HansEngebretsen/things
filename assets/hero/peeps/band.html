<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peeps band</title>
<!-- The peeps header band, live: the app's own people in three rows across the window, none cut by the edge, and no two
     the same (Hans, 13 Nov: they were twelve faces repeated). Every other seat is one of the app's modern avatars
     (css/styles.css in the peeps repo, without its name tag: the oval tombstone mask with hair popping out; av/), the
     seats between them its standing pixel people (js/pixel-art.js, whole, with their ground shadow; px/). The app's own
     twelve sit nearest the middle and its other business faces fill outward. They drift together on one slow sine (a
     couple of percent of a head, its phase rolling across the rows), drawn at fractional positions on one canvas, so
     the motion glides. Every card is baked once into its own bitmap, and everything is rebuilt when the page is resized,
     so it is never stretched. Sizes are in units of the page's height, which the site keeps at the band's (an expanded
     band is shown whole, at the one band height), so the middle 4:3 always matches the still
     (assets/hero/peeps/stage.webp, captured from this page with ?still by scripts/heroes.mjs). -->
<style>
  /* the app's background, laid out as the still has it (a picture 4.8 band heights wide, centred), so the page fades in over
     the still without the background shifting */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f4f5 linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%) center / 480vh 100vh no-repeat; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
<body>
<canvas></canvas>
<script>
// The app's grid (120px avatars, 30px gaps across, 60px down). Rows alternate half a seat, as the drawing has them.
// Colours cycle by card index, as the app does. POOL: the app's default roster, then its other business faces (less the
// yellow-skinned, green-tongued and skull-shirted ones); PX: eighty standing pixel people, each from its own seed.
const ROSTER = ['CISO', 'Engineer', 'Hunter', 'Investigator', 'Manager', 'Analyst_Sr', 'Developer', 'Admin', 'Analyst_Jr', 'Architect', 'Forensics', 'IR'];
const POOL = [...ROSTER, ...['b0', 'a0', 'b1', 'a1', 'b2', 'a2', 'b3', 'a4', 'b4', 'a5', 'b5', 'a6', 'b7', 'a8', 'b9', 'a10', 'b12', 'a12', 'b13', 'a14', 'b15', 'a15', 'b16', 'a19', 'b17', 'a20', 'b18', 'a21', 'b19', 'a22', 'b20', 'a26', 'b21', 'a27', 'b22', 'a28', 'b23', 'a29', 'b24', 'a30', 'b25', 'a31', 'b26', 'a32', 'b28', 'a34', 'b29', 'a35', 'b30', 'a36', 'b31', 'a40', 'b33', 'a42', 'b34', 'a43', 'b35', 'a44', 'b36', 'a45', 'b37', 'a46', 'b39', 'a47', 'b41', 'a48', 'b42', 'a50', 'b43', 'a51', 'b44', 'a52', 'b45', 'a55', 'b46', 'a56', 'b47', 'a59', 'b48', 'b51', 'b52', 'b53', 'b54', 'b55', 'b56', 'b57', 'b58', 'b59']];
const PX = Array.from({ length: 80 }, (_, i) => 'p' + i);
const BG = ['#4da667', '#f6cf64', '#a9accd', '#e0e0e0'];
// ?card: the picture the drawing is traced on (a 1200 x 900 window): the same seats and people at 3/5 the size, the layout
// the drawing was first traced on, which lands on the header scaled 5/3 about the stage's centre; the edges cut whoever they cut
const card = location.search.includes('card');
const still = card || location.search.includes('still') || matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = document.querySelector('canvas'), ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
let h, w, S, DX, DY, TOP, PAD, IH, cards = [];
// Three rows of big peeps across the whole window (the middle row half a seat over), and
// every one whole: a seat the window's edge would cut is left empty (Hans: bigger, expansive, no half peeps). The rows
// fill the band: each avatar a quarter of its height (90 px in a 360 px band). The layout is exactly 5/3 of the one the
// drawing was traced on (round 13: S .15, DX .2, DY .19, the middle row on the band's middle), so the drawing lands on
// it scaled 5/3 about the stage's centre (heroes.py LANDS peeps) and the open's reveal runs.
function layout() {
  h = innerHeight; w = innerWidth; const Z = card ? 1 : 5 / 3; S = h * .15 * Z; DX = h * .2 * Z; DY = h * .19 * Z;
  IH = S * 280 / 264; PAD = Math.ceil(IH - S) + 2;   // the avatar is taller than its square; room above for the hair
  TOP = h * .5 - DY;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const reach = Math.ceil(w / 2 / DX) + 1; cards = [];
  for (let r = 0; r < 3; r++) for (let k = -reach; k < reach; k++) {
    const x = w / 2 + (k + (r % 2 ? 0 : .5)) * DX, y = TOP + r * DY;
    if (!card && (x - S / 2 < 8 || x + S / 2 > w - 8)) continue;   // whole peeps only: none cut by the window's edge
    // nor under the site's back arrow (its circle plus 8 px, the top-left 68 px): the band starts at the window's top left
    // (seats.json carries these rules to the site, which paints the same seats out of the still it shows first)
    if (!still && x - S / 2 < 68 && y - S * .57 < 68) continue;
    // each seat's person depends on the seat alone, never on the window's width, so the still (captured wide) and the
    // live page (at the window's width) put the same person in the same seat
    // every seat its own person: seats are numbered outward from the middle, so the app's own twelve sit in the middle
    const j = k >= 0 ? 2 * k : -2 * k - 1, id = j * 3 + r;
    const px = (k + r + 400) % 2 === 0;   // every other seat is one of the app's standing pixel people (Hans, 13 Nov)
    cards.push(px ? { x, y, px: true, file: 'px/' + PX[id % PX.length], bg: BG[(k + r * 2 + 400) % 4], ph: k * .55 + r * 1.3 }
                  : { x, y, file: 'av/' + POOL[id % POOL.length], bg: BG[(k + r * 2 + 400) % 4], ph: k * .55 + r * 1.3 });
  }
}
// one card, as the app draws it: the oval behind, then the avatar at full width, bottom-aligned, shown inside the oval
// and everything above the oval's equator (so hair pops out of the shape)
function bake(img, bg, px) {
  const c = document.createElement('canvas'); c.width = Math.ceil(S * dpr); c.height = Math.ceil((S + PAD) * dpr);
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const bot = S + PAD, cx = S / 2, rx = S * .45, ry = S * .4, eq = bot - ry;
  if (px) {   // a standing pixel person, as the app's pixel style shows them whole: no tile, feet where the oval's foot is, whole device pixels per sprite pixel
    // Always the same share of a seat (112/135 of its width, the size the drawing was traced at), whatever the window:
    // rounded to whole device pixels it was 4% bigger live than in the still at a 360 px band, so every pixel person
    // hopped as the page took over (Hans, 13 Nov). Blown up by a whole number first, so the sprite's pixels stay square
    // and hard, then drawn at the exact size.
    const pw = S * 112 / 135, u = Math.max(1, Math.ceil(pw * dpr / 32)); c.width = 32 * u; c.height = 48 * u; const g2 = c.getContext('2d'); g2.imageSmoothingEnabled = false; g2.drawImage(img, 0, 0, c.width, c.height); c.px = [pw, pw * 1.5, pw / 8]; return c; }
  g.fillStyle = bg; g.beginPath(); g.ellipse(cx, eq, rx, ry, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.rect(0, 0, S, eq); g.ellipse(cx, eq, rx, ry, 0, 0, Math.PI * 2); g.clip('nonzero');
  g.drawImage(img, 0, bot - IH, S, IH);
  return c;
}
// one slow, shared drift: each head bobs a couple of percent of its size on a long sine, the phase rolling across the
// rows like a breeze, so the crowd moves together and smoothly instead of each head twitching on its own keyframes
const drift = (t, ph) => [S * .012 * Math.sin(t * 2 * Math.PI / 7 + ph * .7), S * .022 * Math.sin(t * 2 * Math.PI / 5.5 + ph)];
let t0 = null;
function draw(now) {
  // the drift eases in from rest over its first two seconds, so the first frame is exactly the still the site shows
  // underneath (assets/hero/peeps/band.webp) and the live page fades in over it without a jump
  if (t0 == null) t0 = now;
  const on = Math.min(1, (now - t0) / 2000), amp = on * on * (3 - 2 * on);
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (const c of cards) {   // at fractional positions, so the motion glides rather than steps a pixel at a time
    const [dx, dy] = still ? [0, 0] : drift((now - t0) / 1000, c.ph).map(v => v * amp);
    // its feet (4 sprite pixels above the box's foot) on the seat's floor; it glides with the faces, not a device pixel at a time
    if (c.bit.px) { const [pw, ph, foot] = c.bit.px; ctx.drawImage(c.bit, (c.x - pw / 2 + dx) * dpr, (c.y + S / 2 - ph + foot + dy) * dpr, pw * dpr, ph * dpr); continue; }
    ctx.drawImage(c.bit, (c.x - S / 2 + dx) * dpr, (c.y - S / 2 - PAD + dy) * dpr);
  }
}
const imgs = {};
const load = f => imgs[f] || (imgs[f] = new Promise(ok => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = `${f}.svg`; }));
// built for the page's size, and rebuilt when it changes, so the band is never stretched
const build = () => { layout(); return Promise.all(cards.map(c => load(c.file).then(im => { c.bit = im ? bake(im, c.bg, c.px) : document.createElement('canvas'); }))); };
let ready = build(), raf = 0;
addEventListener('resize', () => { ready = build().then(() => still && draw(0)); });
ready.then(() => {
  if (still) { draw(0); return; }
  // only while the header is on screen: a same-origin frame is not throttled when scrolled away (22% CPU off screen)
  let vis = true;
  const loop = now => { draw(now); raf = vis ? requestAnimationFrame(loop) : 0; }; raf = requestAnimationFrame(loop);
  new IntersectionObserver(([e]) => { vis = e.isIntersecting; if (vis && !raf) raf = requestAnimationFrame(loop); }).observe(cv);
});
</script>
